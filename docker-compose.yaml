version: '3.8'

services:
  postgre:
    image: postgres
    container_name: core-postgre
    environment:
       POSTGRES_PASSWORD: Unr4vel!
       POSTGRES_USER: Unravel
       POSTGRES_DB: template_db
    ports:
      - 5432:5432
    volumes:
      - postgres-template-data:/var/lib/postgresql/data
    networks:
      - app-network

  redis:
    image: redis:6.2-alpine
    restart: always
    container_name: core-redis
    environment:
        REDIS_PASSWORD: Unr4vel!
    command: redis-server --save 20 1 --loglevel warning --requirepass Unr4vel!
    ports:
      - "6379:6379"
    volumes:
      - ./myredis/conf:/usr/local/etc/redis
    networks:
      - app-network

  rabbitmq:
    image: rabbitmq:3-management
    container_name: core-message-broker
    environment:
        - RABBITMQ_DEFAULT_USER=Unravel
        - RABBITMQ_DEFAULT_PASS=Unr4vel!
    restart: always
    ports:
        - "5672:5672"
        - "15672:15672"
    networks:
        - app-network
    volumes:
        - "rabbitmq-volume:/etc/rabbitmq/rabbitmq-volume"

  jaeger:
    image: jaegertracing/all-in-one:1.49  
    container_name: core-jaeger
    ports: 
        - 4317:4317 # gRPC
        - 4318:4318 # HTTP
        - 16686:16686 # UI

  elasticsearch:
     image: elasticsearch:8.15.0
     container_name: core-elk
     ports: 
        - 9200:9200
        - 9300:9300
     environment:
        - xpack.security.enabled=false
        - "discovery.type=single-node"
        - ELASTIC_USERNAME=Unravel
        - ELASTIC_PASSWORD=Unr4vel!
        - ES_JAVA_OPTS=-Xms4g -Xmx4g
     networks:
        - app-network
     volumes:
        - elastic-volume:/usr/share/elasticsearch/data

  kibana: 
     image: kibana:8.15.0
     container_name: core-kibana
     ports:
        - 5601:5601
     environment:
        - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
     networks:
        - app-network
     depends_on:
        - elasticsearch

  core.template.api:
    container_name: core.template.api
    build:
        context: .
        dockerfile: src/Presentation/API/Dockerfile
    restart: on-failure
    environment:
        - ASPNETCORE_ENVIRONMENT=Development
        - "ConnectionStrings:PgSQL=Server=postgre;Port=5432;Database=template_db;User Id=Unravel;Password=Unr4vel!;"
        - "Token:Audience=Unravel"
        - "Token:Issuer=Unravel"
        - "Token:SecurityKey=myubersuberprivatesecuritykey12345!Unr4vel!"
        - "Redis:Host=redis"
        - "Redis:Port=6379"
        - "Redis:Password=Unr4vel!"
        - "Redis:DbIndex=1"
        - "RabbitMQOptions:Host=rabbitmq"
        - "RabbitMQOptions:Port=5672"
        - "RabbitMQOptions:Username=Unravel"
        - "RabbitMQOptions:Password=Unr4vel!"
        - "OpenTelemetry:ServiceName=CoreTemplate.API"
        - "OpenTelemetry:ServiceVersion=1.0.0"
        - "OpenTelemetry:ActivitySourceName=CoreTemplate.API"
        # Burasi cokomelli elasticsearch url bilgisi bu sekilde verilmek zorunda
        - "Elastic:Url=http://elasticsearch:9200"
        - "Elastic:Username=Unravel"
        - "Elastic:Password=Unr4vel!"
        - "Elastic:IndexName=coretemplate.api"
    ports:
        - 5212:8080
    depends_on:
        - postgre
        - redis
        - rabbitmq
        - jaeger
        - elasticsearch
    networks:
        - app-network


networks:
  app-network:
    driver: bridge

volumes:
  postgres-template-data:
  rabbitmq-volume:  
  elastic-volume:  